site_name: CIM for Norway
extra_css:
- stylesheets/extra.css
extra_javascript:
- https://unpkg.com/@elevenlabs/convai-widget-embed
extra:
  elevenlabs_widget: <elevenlabs-convai agent-id="agent_9901k3qybvkte7wszs3qqw58rx9n"></elevenlabs-convai>
theme:
  name: material
  custom_dir: overrides
  favicon: images/cim4nologo.svg
  logo: images/cim4nologo.svg
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.annotation
  - content.code.copy
  language: en
  palette:
  - scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
    primary: black
    accent: red
  - scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode
    primary: black
    accent: green
markdown_extensions:
- pymdownx.betterem
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
