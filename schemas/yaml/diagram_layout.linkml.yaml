imports:
- linkml:types
default_curi_maps:
- semweb_context
default_range: string
default_prefix: this
classes:
  Diagram:
    description: "The diagram being exchanged. The coordinate system is a standard Cartesian coordinate system and the orientation attribute defines the orientation. The initial view related attributes can be used to specify an initial view with the x,y coordinates of the diagonal points."
    annotations:
      ea_guid: "EAID_E982A207_6642_4fb9_A092_40DFA2B37027"
    is_a: IdentifiedObject
    class_uri: cim:Diagram
    attributes: 
      x1InitialView:
        description: "X coordinate of the first corner of the initial view."
        annotations:
          ea_guid: "EAID_C3E7979E_7009_4acc_BEFD_4EE6C76AC48B"
        slot_uri: cim:Diagram.x1InitialView
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      x2InitialView:
        description: "X coordinate of the second corner of the initial view."
        annotations:
          ea_guid: "EAID_8D98579B_5D7F_44a7_B694_6ADA4287C5AB"
        slot_uri: cim:Diagram.x2InitialView
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      y1InitialView:
        description: "Y coordinate of the first corner of the initial view."
        annotations:
          ea_guid: "EAID_F9ED2529_E452_4556_ACAD_C33EA342768B"
        slot_uri: cim:Diagram.y1InitialView
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      y2InitialView:
        description: "Y coordinate of the second corner of the initial view."
        annotations:
          ea_guid: "EAID_FC6220EE_D6C6_4c8c_A6AF_02463B048936"
        slot_uri: cim:Diagram.y2InitialView
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      DiagramStyle:
        description: "A Diagram may have a DiagramStyle."
        annotations:
          ea_guid: "EAID_442E3273_18B9_4a81_A9E5_42B612D453BC-B"
        slot_uri: cim:Diagram.DiagramStyle
        range: DiagramStyle
        minimum_cardinality: 0
        maximum_cardinality: 1
  DiagramObject:
    description: "An object that defines one or more points in a given space. This object can be associated with anything that specializes IdentifiedObject. For single line diagrams such objects typically include such items as analog values, breakers, disconnectors, power transformers, and transmission lines."
    annotations:
      ea_guid: "EAID_E5A0EE1A_EA81_4542_8974_B5D3C2F3F465"
    is_a: IdentifiedObject
    class_uri: cim:DiagramObject
    attributes: 
      drawingOrder:
        description: "The drawing order of this element. The higher the number, the later the element is drawn in sequence. This is used to ensure that elements that overlap are rendered in the correct order."
        annotations:
          ea_guid: "EAID_9C8F08EF_6539_4118_BEA5_1E00C412E809"
        slot_uri: cim:DiagramObject.drawingOrder
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      isPolygon:
        description: "Defines whether or not the diagram objects points define the boundaries of a polygon or the routing of a polyline. If this value is true then a receiving application should consider the first and last points to be connected."
        annotations:
          ea_guid: "EAID_E105F67A_F735_40c8_828B_50637B38AEBC"
        slot_uri: cim:DiagramObject.isPolygon
        range: boolean
        minimum_cardinality: 0
        maximum_cardinality: 1
      offsetX:
        description: "The offset in the X direction. This is used for defining the offset from centre for rendering an icon (the default is that a single point specifies the centre of the icon).The offset is in per-unit with 0 indicating there is no offset from the horizontal centre of the icon.  -0.5 indicates it is offset by 50% to the left and 0.5 indicates an offset of 50% to the right."
        annotations:
          ea_guid: "EAID_9E1EABB6_8384_40b8_B97D_CAC2F81D25CC"
        slot_uri: cim:DiagramObject.offsetX
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      offsetY:
        description: "The offset in the Y direction. This is used for defining the offset from centre for rendering an icon (the default is that a single point specifies the centre of the icon).The offset is in per-unit with 0 indicating there is no offset from the vertical centre of the icon.  The offset direction is dependent on the orientation of the diagram, with -0.5 and 0.5 indicating an offset of +/- 50% on the vertical axis."
        annotations:
          ea_guid: "EAID_10731F3A_76D6_488f_8C14_CC488A1F8B2D"
        slot_uri: cim:DiagramObject.offsetY
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      rotation:
        description: "Sets the angle of rotation of the diagram object.  Zero degrees is pointing to the top of the diagram.  Rotation is clockwise.  DiagramObject.rotation=0 has the following meaning: The connection point of an element which has one terminal is pointing to the top side of the diagram. The connection point From side of an element which has more than one terminal is pointing to the top side of the diagram.DiagramObject.rotation=90 has the following meaning: The connection point of an element which has one terminal is pointing to the right hand side of the diagram. The connection point From side of an element which has more than one terminal is pointing to the right hand side of the diagram."
        annotations:
          ea_guid: "EAID_57D901DD_45DA_42f6_8A86_9C0EDBB27214"
        slot_uri: cim:DiagramObject.rotation
        range: AngleDegrees
        minimum_cardinality: 0
        maximum_cardinality: 1
      Diagram:
        description: "A diagram object is part of a diagram."
        annotations:
          ea_guid: "EAID_5C4A600A_6EA7_4ac1_A144_9E7C309F375B-A"
        slot_uri: cim:DiagramObject.Diagram
        range: Diagram
        minimum_cardinality: 1
        maximum_cardinality: 1
      DiagramObjectStyle:
        description: "A diagram object has a style associated that provides a reference for the style used in the originating system."
        annotations:
          ea_guid: "EAID_2D17C38C_27D8_402d_9B7B_687AC6753212-A"
        slot_uri: cim:DiagramObject.DiagramObjectStyle
        range: DiagramObjectStyle
        minimum_cardinality: 0
        maximum_cardinality: 1
      IdentifiedObject:
        description: "The domain object to which this diagram object is associated."
        annotations:
          ea_guid: "EAID_03423B70_34E0_4313_B19B_5FAFFD1F143B-B"
        slot_uri: cim:DiagramObject.IdentifiedObject
        range: IdentifiedObject
        minimum_cardinality: 0
        maximum_cardinality: 1
  DiagramObjectGluePoint:
    description: "This is used for grouping diagram object points from different diagram objects that are considered to be glued together in a diagram even if they are not at the exact same coordinates."
    annotations:
      ea_guid: "EAID_9C1F1E7A_8711_422b_9415_9BCC8A04C0CD"
    class_uri: cim:DiagramObjectGluePoint
    attributes: 
  DiagramObjectPoint:
    description: "A point in a given space defined by 3 coordinates and associated to a diagram object.  The coordinates may be positive or negative as the origin does not have to be in the corner of a diagram."
    annotations:
      ea_guid: "EAID_4E77FE4E_1547_4538_A26A_26B06F42FA7C"
    class_uri: cim:DiagramObjectPoint
    attributes: 
      sequenceNumber:
        description: "The sequence position of the point, used for defining the order of points for diagram objects acting as a polyline or polygon with more than one point. The attribute shall be a positive value."
        annotations:
          ea_guid: "EAID_DD5337A3_21F0_414c_B772_EC69C25CB9C0"
        slot_uri: cim:DiagramObjectPoint.sequenceNumber
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      xPosition:
        description: "The X coordinate of this point."
        annotations:
          ea_guid: "EAID_A3590665_8EB6_420f_B38D_80EDBB9A2879"
        slot_uri: cim:DiagramObjectPoint.xPosition
        range: float
        minimum_cardinality: 1
        maximum_cardinality: 1
      yPosition:
        description: "The Y coordinate of this point."
        annotations:
          ea_guid: "EAID_997CF101_75B1_45e4_9EEE_974A5021B21A"
        slot_uri: cim:DiagramObjectPoint.yPosition
        range: float
        minimum_cardinality: 1
        maximum_cardinality: 1
      zPosition:
        description: "The Z coordinate of this point."
        annotations:
          ea_guid: "EAID_DD934E69_A026_4e5c_8806_B82F21273BEE"
        slot_uri: cim:DiagramObjectPoint.zPosition
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
      DiagramObject:
        description: "The diagram object with which the points are associated."
        annotations:
          ea_guid: "EAID_4DFBB74F_9127_43ee_A7AA_04329802814F-B"
        slot_uri: cim:DiagramObjectPoint.DiagramObject
        range: DiagramObject
        minimum_cardinality: 1
        maximum_cardinality: 1
      DiagramObjectGluePoint:
        description: "The 'glue' point to which this point is associated."
        annotations:
          ea_guid: "EAID_1C8A6E42_935B_4a26_88C0_9F9E2AB80D36-A"
        slot_uri: cim:DiagramObjectPoint.DiagramObjectGluePoint
        range: DiagramObjectGluePoint
        minimum_cardinality: 0
        maximum_cardinality: 1
  DiagramObjectStyle:
    description: "A reference to a style used by the originating system for a diagram object.  A diagram object style describes information such as line thickness, shape such as circle or rectangle etc, and colour."
    annotations:
      ea_guid: "EAID_2145CBC1_D95B_40b2_BCF9_A9ED41CE9941"
    is_a: IdentifiedObject
    class_uri: cim:DiagramObjectStyle
    attributes: 
  DiagramStyle:
    description: "The diagram style refers to a style used by the originating system for a diagram.  A diagram style describes information such as schematic, geographic, etc."
    annotations:
      ea_guid: "EAID_30A35FB7_F62D_46cf_BB1E_B6F33BD62651"
    is_a: IdentifiedObject
    class_uri: cim:DiagramStyle
    attributes: 
  IdentifiedObject:
    description: "This is a root class to provide common identification for all classes needing identification and naming attributes."
    annotations:
      ea_guid: "EAID_055C5806_E9D8_4a7a_9307_DAF7C31763C7"
    abstract: true
    class_uri: cim:IdentifiedObject
    attributes: 
      mRID:
        description: "Master resource identifier issued by a model authority. The mRID is unique within an exchange context. Global uniqueness is easily achieved by using a UUID, as specified in RFC 4122, for the mRID. The use of UUID is strongly recommended.For CIMXML data files in RDF syntax conforming to IEC 61970-552, the mRID is mapped to rdf:ID or rdf:about attributes that identify CIM object elements."
        annotations:
          ea_guid: "EAID_C775F80A_A23D_4f38_AB9D_49D1FA882337"
        slot_uri: cim:IdentifiedObject.mRID
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
      description:
        description: "The description is a free human readable text describing or naming the object. It may be non unique and may not correlate to a naming hierarchy."
        annotations:
          ea_guid: "EAID_13104BE9_CB1E_4dde_9A52_D7EE95DF7B65"
        slot_uri: cim:IdentifiedObject.description
        range: string
        minimum_cardinality: 0
        maximum_cardinality: 1
      name:
        description: "The name is any free human readable and possibly non unique text naming the object."
        annotations:
          ea_guid: "EAID_870F033B_EDA6_4a32_A5AD_47DCBBFE2997"
        slot_uri: cim:IdentifiedObject.name
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
  TextDiagramObject:
    description: "A diagram object for placing free-text or text derived from an associated domain object."
    annotations:
      ea_guid: "EAID_ECCF586E_4F69_4f21_B234_DDE8C6974F0F"
    is_a: DiagramObject
    class_uri: cim:TextDiagramObject
    attributes: 
      text:
        description: "The text that is displayed by this text diagram object."
        annotations:
          ea_guid: "EAID_CE3AEAE4_F12B_4049_97ED_61BF9EDEB14E"
        slot_uri: cim:TextDiagramObject.text
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
  VisibilityLayer:
    description: "Layers are typically used for grouping diagram objects according to themes and scales. Themes are used to display or hide certain information (e.g., lakes, borders), while scales are used for hiding or displaying information depending on the current zoom level (hide text when it is too small to be read, or when it exceeds the screen size). This is also called de-cluttering.CIM based graphics exchange supports an m:n relationship between diagram objects and layers. The importing system shall convert an m:n case into an appropriate 1:n representation if the importing system does not support m:n."
    annotations:
      ea_guid: "EAID_8EE633AA_3247_439f_BD39_59D924061A0B"
    is_a: IdentifiedObject
    class_uri: cim:VisibilityLayer
    attributes: 
      drawingOrder:
        description: "The drawing order for this layer.  The higher the number, the later the layer and the objects within it are rendered."
        annotations:
          ea_guid: "EAID_956B59BC_6351_48b2_8FA2_1C4DE7166D80"
        slot_uri: cim:VisibilityLayer.drawingOrder
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      VisibleObjects:
        description: "A visibility layer can contain one or more diagram objects."
        annotations:
          ea_guid: "EAID_86380B03_52EA_473d_9BFA_DCDAAE9D1275-B"
        slot_uri: cim:VisibilityLayer.VisibleObjects
        range: DiagramObject
        minimum_cardinality: 1
        multivalued: true
      value:
        annotations:
          ea_guid: "EAID_8C467CE2_6EA5_4aed_810B_32597261DB61"
        slot_uri: cim:AngleDegrees.value
        range: float
        minimum_cardinality: 0
        maximum_cardinality: 1
types:
  AngleDegrees:
    uri: xsd:float
    base: float
    description: "Measurement of angle in degrees."
    annotations:
      ea_guid: "EAID_A633BDC9_A238_4f69_AF1B_FF8A5C2FFCC8"
      cim_data_type: true
      uri: cim:AngleDegrees
enums:
  OrientationKind:
    description: "The orientation of the coordinate system with respect to top, left, and the coordinate number system."
    annotations:
      ea_guid: "EAID_A91C1953_7D39_41d4_B0E8_C88B80E11D26"
    enum_uri:  http://iec.ch/TC57/CIM100#OrientationKind
    permissible_values:
      negative:
        meaning:  cim:OrientationKind.negative
        description: "For 2D diagrams, a negative orientation gives the left-hand orientation (favoured by computer graphics displays) with X values increasing from left to right and Y values increasing from top to bottom.   This is also known as a left hand orientation."
        annotations:
          ea_guid: "EAID_6D82C240_A79A_4526_8D68_5EB815024164"
      positive:
        meaning:  cim:OrientationKind.positive
        description: "For 2D diagrams, a positive orientation will result in X values increasing from left to right and Y values increasing from bottom to top.  This is also known as a right hand orientation."
        annotations:
          ea_guid: "EAID_860B40F5_247F_42ae_9737_7FE0EC735E60"
