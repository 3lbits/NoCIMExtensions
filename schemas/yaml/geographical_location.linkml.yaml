classes:
  CoordinateSystem:
    description: "Coordinate reference system."
    annotations:
      ea_guid: "EAID_D7A22063_DBE9_467d_9E72_C32640FABCA0"
    is_a: IdentifiedObject
    class_uri: cim:CoordinateSystem
    attributes: 
      crsUrn:
        description: "A Uniform Resource Name (URN) for the coordinate reference system (crs) used to define 'Location.PositionPoints'.An example would be the European Petroleum Survey Group (EPSG) code for a coordinate reference system, defined in URN under the Open Geospatial Consortium (OGC) namespace as: urn:ogc:def:crs:EPSG::XXXX, where XXXX is an EPSG code (a full list of codes can be found at the EPSG Registry web site http://www.epsg-registry.org/). To define the coordinate system as being WGS84 (latitude, longitude) using an EPSG OGC, this attribute would be urn:ogc:def:crs:EPSG::4236.A profile should limit this code to a set of allowed URNs agreed to by all sending and receiving parties."
        annotations:
          ea_guid: "EAID_961FC72C_29B9_4d09_B575_0140E5585552"
        slot_uri: cim:CoordinateSystem.crsUrn
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
  IdentifiedObject:
    description: "This is a root class to provide common identification for all classes needing identification and naming attributes."
    annotations:
      ea_guid: "EAID_055C5806_E9D8_4a7a_9307_DAF7C31763C7"
    abstract: true
    class_uri: cim:IdentifiedObject
    attributes: 
      mRID:
        description: "Master resource identifier issued by a model authority. The mRID is unique within an exchange context. Global uniqueness is easily achieved by using a UUID, as specified in RFC 4122, for the mRID. The use of UUID is strongly recommended.For CIMXML data files in RDF syntax conforming to IEC 61970-552, the mRID is mapped to rdf:ID or rdf:about attributes that identify CIM object elements."
        annotations:
          ea_guid: "EAID_C775F80A_A23D_4f38_AB9D_49D1FA882337"
        slot_uri: cim:IdentifiedObject.mRID
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
      name:
        description: "The name is any free human readable and possibly non unique text naming the object."
        annotations:
          ea_guid: "EAID_870F033B_EDA6_4a32_A5AD_47DCBBFE2997"
        slot_uri: cim:IdentifiedObject.name
        range: string
        minimum_cardinality: 0
        maximum_cardinality: 1
  Location:
    description: "The place, scene, or point of something where someone or something has been, is, and/or will be at a given moment in time. It can be defined with one or more position points (coordinates) in a given coordinate system."
