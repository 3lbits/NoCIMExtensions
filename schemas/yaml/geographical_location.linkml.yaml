          ea_guid: "EAID_150622F9_462B_4479_9DC4_F9035E140110"
        slot_uri: cim:PositionPoint.yPosition
        range: string
        minimum_cardinality: 1
        maximum_cardinality: 1
      zPosition:
        description: "(if applicable) Z axis position."
        annotations:
          ea_guid: "EAID_A0537144_D5D9_4a24_805C_D4478E98690C"
        slot_uri: cim:PositionPoint.zPosition
        range: string
        minimum_cardinality: 0
        maximum_cardinality: 1
      Location:
        description: "Location described by this position point."
        annotations:
          ea_guid: "EAID_DBF35456_ABE1_4deb_A885_2E48B3D6F8F6-B"
        slot_uri: cim:PositionPoint.Location
        range: Location
        minimum_cardinality: 1
        maximum_cardinality: 1
