          ea_guid: "EAID_9C1FA17F_EC70_452a_9BD5_2F5E29234B28"
        slot_uri: cim:PositionPoint.sequenceNumber
        range: integer
        minimum_cardinality: 0
        maximum_cardinality: 1
      xPosition:
        description: "X axis position."
