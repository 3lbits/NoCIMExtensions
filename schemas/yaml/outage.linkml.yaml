  Location:
    description: "rdfs:isDefinedBy : http://www.w3.org/ns/prov-o#<http://www.w3.org/ns/prov#n> : http://www.w3.org/TR/2013/REC-prov-n-20130430/#expression-attribute^^xsd:anyURI<http://www.w3.org/ns/prov#category> : expanded^^xsd:stringrdfs:seeAlso : http://www.w3.org/ns/prov#atLocationrdfs:label : Location^^xsd:string<http://www.w3.org/ns/prov#dm> : http://www.w3.org/TR/2013/REC-prov-dm-20130430/#term-attribute-location^^xsd:anyURI<http://www.w3.org/ns/prov#definition> : A location can be an identifiable geographic place (ISO 19112), but it can also be a non-geographic place such as a directory, row, or column. As such, there are numerous ways in which location can be expressed, such as by a coordinate, address, landmark, and so forth.@en"
